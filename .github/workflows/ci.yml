# Runs on every push and pull request.
# The tests replace Ollama with fakes, so CI needs no model and no GPU.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t llama-document-intelligence .

      - name: Check that the container starts and answers /health
        run: |
          docker run -d --name api -p 8000:8000 llama-document-intelligence
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1